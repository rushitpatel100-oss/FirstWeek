[project]
name = "firstweek-api"
version = "0.1.0"
description = "FirstWeek HTTP API."
requires-python = ">=3.12"
dependencies = [
    "firstweek-core",
    "firstweek-research",
    "firstweek-simulation",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "redis>=8.1",
    "temporalio>=1.35",
]

[dependency-groups]
dev = ["httpx2>=2.16"]

[tool.uv.sources]
firstweek-core = { workspace = true }
firstweek-research = { workspace = true }
firstweek-simulation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstweek_api"]
