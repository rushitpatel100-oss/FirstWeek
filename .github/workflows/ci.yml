name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: firstweek
          POSTGRES_PASSWORD: firstweek
          POSTGRES_DB: firstweek
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U firstweek" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://firstweek:firstweek@localhost:5432/firstweek
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy packages/core/src packages/core/tests apps/api/src services/worker/src
      - name: Migrate (up, drift check, down, up)
        run: |
          uv run alembic -c packages/core/alembic.ini upgrade head
          uv run alembic -c packages/core/alembic.ini check
          uv run alembic -c packages/core/alembic.ini downgrade base
          uv run alembic -c packages/core/alembic.ini upgrade head
      - name: Test
        run: uv run pytest

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm build

  stack:
    name: Full stack (docker compose up + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start every service
        run: docker compose up -d --build
      - name: Wait until the API reports every dependency ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ready; then echo; exit 0; fi
            sleep 3
          done
          echo "API never became ready"; exit 1
      - name: Smoke workflow (API -> Temporal -> worker -> Postgres)
        run: |
          out=$(curl -fsS -X POST "http://localhost:8000/system/smoke?name=ci")
          echo "$out"
          echo "$out" | grep -q '"database_ok":true'
      - name: Web app renders
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000 | grep -q FirstWeek; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Show service state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
