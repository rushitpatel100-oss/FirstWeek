# One command starts the whole stack:  docker compose up --build
#   Web app      http://localhost:3000
#   API          http://localhost:8000/docs
#   Temporal UI  http://localhost:8233

x-python-env: &python-env
  DATABASE_URL: postgresql+psycopg://firstweek:firstweek@postgres:5432/firstweek
  REDIS_URL: redis://redis:6379/0
  TEMPORAL_ADDRESS: temporal:7233

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: firstweek
      POSTGRES_PASSWORD: firstweek
      POSTGRES_DB: firstweek
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstweek -d firstweek"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:latest
    # In-memory dev server: workflow history resets when the container restarts, which is
    # fine for development. (The image runs as a non-root user, so a root-owned volume for
    # --db-filename stops it from starting.)
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports: ["7233:7233", "8233:8233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args: { PACKAGE: firstweek-core }
    command: ["alembic", "-c", "packages/core/alembic.ini", "upgrade", "head"]
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args: { PACKAGE: firstweek-api }
    command: ["uvicorn", "firstweek_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment: *python-env
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args: { PACKAGE: firstweek-worker }
    command: ["python", "-m", "firstweek_worker.main"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *python-env
      # CI sets this to false so the smoke test never starts a real research run.
      RESEARCH_DAILY_ENABLED: ${RESEARCH_DAILY_ENABLED:-true}
      # The local embedding model (~65 MB) downloads on first use; the volume keeps it
      # across rebuilds.
      MODEL_CACHE_DIR: /models
    volumes: [models:/models]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }

  web:
    build: { context: apps/web }
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on: [api]

volumes:
  pgdata:
  models:
