# Golden role. The definition is the classifier's yardstick for "is this posting this role?".
# It is a scoping decision, not a claim about the world: Rushit reviews it before it is trusted.
slug: genai-engineer
name: GenAI Engineer
trust_level: golden
reviewed: false
definition: >-
  Builds product features and internal tools on top of foundation models (large language
  models and other generative models). Core work: prompt and context design, retrieval-
  augmented generation (RAG), choosing and adapting models (fine-tuning, distillation),
  building evaluation sets and metrics for model output, and integrating model calls into
  applications with attention to latency, cost and safety. Distinct from ML research
  (pretraining, research-scale post-training, new architectures) and from data science
  (analysis and classical ML).
  Counts only when hands-on building is the main job. Not counted: people managers whose
  core is leading a team; advisory, strategy and pre-sales roles, at consultancies too; and
  forward-deployed, applied-AI, solutions and agent-delivery roles at AI vendors whose main
  job is delivering for the vendor's customers (advising, workshops, deployment support, or
  building custom applications or agents for those customers). Those vendor roles are a
  separate role. Engineers who build these systems for clients at a consultancy do count.
aliases:
  - GenAI Engineer
  - Gen AI Engineer
  - Generative AI Engineer
  - GenAI Developer
  - Generative AI Developer
  - LLM Engineer
  - LLM Application Engineer
  - AI Engineer, Generative AI
# Job-board pre-filter: the shared broad AI filter in data/title_filters.yaml.
title_filter: ai
web_queries:
  - 'what does a {name} do day to day'
  - '{name} day in the life'
  - 'generative AI engineer real work challenges production'
  - 'LLM engineer what I actually do at work'
