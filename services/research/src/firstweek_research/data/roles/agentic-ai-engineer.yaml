# Golden role. See genai-engineer.yaml for what these fields mean.
slug: agentic-ai-engineer
name: Agentic AI Engineer
trust_level: golden
reviewed: false
definition: >-
  Builds AI agents: systems where a model plans and takes multi-step actions through tools,
  APIs or other agents with limited human input. Core work: tool and function calling,
  orchestration frameworks (for example LangGraph), memory and state management, multi-agent
  coordination, guardrails and human-in-the-loop controls, and evaluating agent behaviour end
  to end. Building the platform agents run on (orchestration, state, tool execution,
  sandboxing) counts. Reinforcement-learning policies for robots or vehicles are not this
  role. A posting counts only if building or operating agents is a primary responsibility,
  not a passing mention.
  Counts only when hands-on building is the main job. Not counted: people managers whose
  core is leading a team; advisory, strategy and pre-sales roles, at consultancies too; and
  forward-deployed, applied-AI, solutions and agent-delivery roles at AI vendors whose main
  job is delivering for the vendor's customers (advising, workshops, deployment support, or
  building custom applications or agents for those customers). Those vendor roles are a
  separate role. Engineers who build these systems for clients at a consultancy do count.
aliases:
  - Agentic AI Engineer
  - Agentic Engineer
  - Agentic Systems Engineer
  - AI Agent Engineer
  - AI Agents Engineer
  - Agent Engineer
  - AI Agent Developer
  - Agentic AI Developer
  - Multi-Agent Systems Engineer
# Job-board pre-filter: the shared broad AI filter in data/title_filters.yaml.
title_filter: ai
web_queries:
  - 'what does an {name} do day to day'
  - 'building AI agents in production lessons learned'
  - 'agent engineer job what I actually work on'
forum_queries:
  - 'what is it really like building AI agents for a living'
  - 'AI agent engineer frustrations at work'
  - 'agent engineer job what surprised me'
