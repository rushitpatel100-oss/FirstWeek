# Golden role. See genai-engineer.yaml for what these fields mean.
slug: ai-software-engineer
name: AI Software Engineer
trust_level: golden
reviewed: false
definition: >-
  A software engineer whose main job is general software engineering on systems that contain
  or serve AI models: backend services and APIs that call models, platforms and
  infrastructure for serving, deploying and operating models (including inference serving
  and optimisation), the data pipelines that feed them, and the product code around them,
  with attention to reliability, monitoring and scale. AI is a component the engineer
  integrates or serves. When the core of the job is model-specific craft (prompt and context
  design, retrieval quality, evaluating model output, designing agent behaviour), the posting
  is a GenAI or Agentic AI Engineer instead, even if it also ships production code. Model
  research and building classical ML models (ranking, recommendation, forecasting) are not
  this role.
  Counts only when hands-on building is the main job. Not counted: people managers whose
  core is leading a team; advisory, strategy and pre-sales roles, at consultancies too; and
  forward-deployed, applied-AI, solutions and agent-delivery roles at AI vendors whose main
  job is delivering for the vendor's customers (advising, workshops, deployment support, or
  building custom applications or agents for those customers). Those vendor roles are a
  separate role. Engineers who build these systems for clients at a consultancy do count.
aliases:
  - AI Software Engineer
  - Software Engineer, AI
  - Software Engineer (AI)
  - Software Engineer, Machine Learning
  - Software Engineer, ML
  - ML Software Engineer
  - Machine Learning Software Engineer
  - Software Engineer, AI Platform
  - AI Platform Engineer
# Job-board pre-filter: the shared broad AI filter in data/title_filters.yaml.
title_filter: ai
web_queries:
  - 'what does an {name} do day to day'
  - 'software engineer working on AI products day in the life'
  - 'shipping LLM features to production lessons learned engineering blog'
forum_queries:
  - 'what is it really like as a software engineer working on LLM features'
  - 'AI software engineer job frustrations at work'
  - 'software engineer moved to AI team what surprised me'
