# Public job-board APIs that companies use to publish their own openings. They return the
# full posting text without a key. Each board was checked for UK openings: the first 25 on
# 2026-10-31 (morning), the rest the same afternoon by probing 164 UK-relevant employers.
#
# Known bias: this list leans towards AI-native companies and tech scale-ups. Banks,
# consultancies and large enterprises mostly use Workday or their own systems, which have
# no public posting API; Adzuna covers them, but only as ~500-character snippets.
# Not reachable this way (checked 2026-10-31): Google DeepMind, Mistral, Hugging Face
# (Workable), Revolut, Skyscanner, Octopus Energy, Ocado, Sky, BBC, LSEG and the large
# consultancies.
#
# Add a company: find its board token in its careers-page URL, e.g.
#   job-boards.greenhouse.io/<token>, jobs.lever.co/<token>, jobs.ashbyhq.com/<token>
# Check the token belongs to the right company: "peak" on Greenhouse is a US physio clinic.
boards:
