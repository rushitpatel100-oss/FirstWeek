# Public job-board APIs that companies use to publish their own openings. They return the
# full posting text without a key. Each board was checked on 2026-10-31 for UK openings.
#
# Known bias: this list leans towards AI-native companies and scale-ups. Adzuna adds the
# wider UK market (banks, consultancies, agencies) but only as ~500-character snippets.
# Add a company: find its board token in its careers-page URL, e.g.
#   job-boards.greenhouse.io/<token>, jobs.lever.co/<token>, jobs.ashbyhq.com/<token>
boards:
  - {company: Anthropic, ats: greenhouse, token: anthropic}
  - {company: Databricks, ats: greenhouse, token: databricks}
  - {company: Deliveroo, ats: greenhouse, token: deliveroo}
