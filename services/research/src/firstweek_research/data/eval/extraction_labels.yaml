# Hand labels for the extraction step (extract-posting): which skills and tools does each
# posting ask for, and at what seniority?
#
# items: taxonomy slugs (data/taxonomy/ai_skills.yaml) the posting asks for or describes doing:
# requirements, nice-to-haves and responsibilities, the same rule the extractor follows.
# Not included: company descriptions, benefits, scam notices, product names the job only
# integrates with, and examples offered as "any language is fine". A team tech-stack list
# counts; a company-wide stack for other teams does not.
#
# seniority: the levels that would be a correct answer (Staff is accepted as lead or
# principal). Left out where the posting does not settle it; those postings are not scored
# for seniority.
#
