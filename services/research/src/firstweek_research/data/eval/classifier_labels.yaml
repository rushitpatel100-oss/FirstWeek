# Hand labels for the role classifier (classify-role): is this posting the role?
#
# Judged against the role definitions in data/roles/*.yaml as worded on 2026-10-31, including
# the exclusion of customer-facing applied-AI roles at AI vendors. A posting can be more than
# one role. "unsure" means the definition does not settle it; unsure labels are reported but
# not scored, and each one is a hint about where a definition needs sharper wording.
#
# Postings are keyed by URL, so the labels work on any database that collected the same
# boards. Drafted by Claude from each posting's text; "checked: true" marks a label Rushit has
# confirmed. Until most are checked, scores measure agreement with a second, stronger model
# rather than accuracy. Change a label when a reviewer decides differently, and say why in
# the note.
#
# Revised 2026-10-31 after the first evaluation, with the wording decided that day: vendor
# teams that build agents or custom applications for the vendor's customers are excluded
# (Sierra and Decagon agent engineers, Scale AI public sector); agent platforms count for
# Agentic AI Engineer; Hudson River Trading's Applied AI Engineer is unsure for GenAI.
#
# checked: true when Rushit confirmed every label on a posting, or a list of the roles whose
# labels he confirmed (for example after settling a disagreement).
#
# Sample (112 postings, 2026-10-31): every UK candidate from the 80 job boards except generic
# "Machine Learning Engineer" titles, plus 15 of those with distinct titles.
