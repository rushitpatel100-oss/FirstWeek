# FirstWeek's AI skills taxonomy (the "AI extension" to ESCO).
# kind: skill = a practice or competency; tool = a named technology, language or product.
# The extractor is shown these labels and asked to reuse them, so wording matters.
# Unknown labels are not dropped: they wait in a review queue (`make review-skills`).
# esco_uri: the equivalent skill in ESCO v1.2.0, the EU's skills classification, when a true
# equivalent exists (`make esco-suggest` lists candidates; a person picks). Entries without
# one are FirstWeek's AI extension: ESCO has no concept for RAG, prompt engineering, agents
# and most AI tooling yet. 18 entries linked on 2026-10-31.
