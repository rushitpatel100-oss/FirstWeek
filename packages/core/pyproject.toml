[project]
name = "firstweek-core"
version = "0.1.0"
description = "Shared contracts, database models and the LLM gateway for FirstWeek."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pgvector>=0.5",
    "litellm>=1.106",
    "langfuse>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstweek_core"]
